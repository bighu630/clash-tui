[package]
name = "mihomo-tui"
version = "0.1.0"
edition = "2021"
description = "Linux mihomo (Clash Meta) TUI controller"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"

[profile.release]
strip = true
lto = true
