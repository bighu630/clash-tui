# 发布工作流
# 触发：推送 v* tag（如 v0.1.0）时自动构建 x86_64 / aarch64 两个 Linux 平台的
# release 二进制，创建 GitHub Release 并上传 tar.gz 产物（含 README + LICENSE）。
# 也可在 Actions 页面手动触发——注意需选择 v* tag 运行（分支上运行会因无 tag 而失败）。
name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # 1) 根据 tag 创建 GitHub Release（若仓库有 CHANGELOG.md 则自动提取对应版本说明）
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 release 需要
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 仓库目前没有 CHANGELOG.md；未来新增后取消注释即可自动生成说明：
          # changelog: CHANGELOG.md

  # 2) 矩阵构建两个平台的产物并上传到上一步创建的 Release
  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 release 产物需要
    strategy:
      fail-fast: false # 一个平台失败不阻塞另一个
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      # Rust 工具链（stable）+ 对应目标 triple
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zig：cargo-zigbuild 的链接器（交叉编译必需）
      - uses: mlugg/setup-zig@v2

      # cargo-zigbuild：无需 Docker 的交叉编译方案，比 cross 更快
      # 项目依赖均为纯 Rust（reqwest 使用 rustls-tls，无 openssl 等系统动态库），
      # 交叉编译无额外系统库负担；产物动态链接 glibc（与本地构建一致）。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # 依赖缓存（key 自动包含 rustc 版本与 target，跨平台共享）
      - uses: Swatinem/rust-cache@v2

      # 构建 + 打包 tar.gz + 上传 Release（checksum: sha256 生成 .sha256 校验文件）
      # archive 模板变量：$bin / $target / $tag
      # 产物命名：mihomo-tui-v0.1.0-x86_64-unknown-linux-gnu.tar.gz（含版本与平台）
      # 只打包 二进制 + README + LICENSE；不含配置（settings.toml 等含订阅凭据，严禁发布）
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mihomo-tui
          target: ${{ matrix.target }}
          build-tool: cargo-zigbuild
          archive: $bin-$tag-$target
          include: README.md,LICENSE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
